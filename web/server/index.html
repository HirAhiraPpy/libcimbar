<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cimbar Web Decoder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      overflow: hidden;
    }

    #video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #scan-frame {
      width: 280px;
      height: 280px;
      border: 3px solid #0f0;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
      position: relative;
    }

    #scan-frame.scanning {
      border-color: #ff0;
      box-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
    }

    #scan-frame.active {
      border-color: #0ff;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.7);
    }

    #scan-frame::before,
    #scan-frame::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #0f0;
      border-style: solid;
    }

    #scan-frame::before {
      top: -3px;
      left: -3px;
      border-width: 3px 0 0 3px;
      border-radius: 10px 0 0 0;
    }

    #scan-frame::after {
      bottom: -3px;
      right: -3px;
      border-width: 0 3px 3px 0;
      border-radius: 0 0 10px 0;
    }

    #status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #status-text {
      text-align: center;
      font-size: 14px;
      color: #aaa;
    }

    #progress-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-bar {
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0f0, #0ff);
      width: 0%;
      transition: width 0.3s;
    }

    #controls {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.4);
    }

    #mode-select {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #444;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    #error-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.9);
      color: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
      display: none;
      z-index: 1000;
    }

    #file-complete {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 128, 0, 0.9);
      color: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
      display: none;
      z-index: 1000;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div id="overlay">
    <div id="scan-frame"></div>
  </div>

  <div id="controls">
    <select id="mode-select" class="btn">
      <option value="Auto">Auto</option>
      <option value="B">Mode B</option>
      <option value="Bu">Mode Bu</option>
      <option value="Bm">Mode Bm</option>
      <option value="4C">Mode 4C</option>
    </select>
  </div>

  <div id="status-bar">
    <div id="status-text">Connecting...</div>
    <div id="progress-container"></div>
  </div>

  <div id="error-message"></div>
  <div id="file-complete">
    <h2>File Received!</h2>
    <p id="complete-filename"></p>
    <p id="complete-size"></p>
  </div>

  <script src="capture.js"></script>
</body>
</html>
